services:
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - /data/sorrynotnhired/models:/models:ro
      - ./Modelfile:/tmp/Modelfile:ro
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_THREADS=3
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - /data/sorrynotnhired/models:/models:ro
      - ./Modelfile:/tmp/Modelfile:ro
      - ./init-ollama.sh:/tmp/init-ollama.sh:ro
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/tmp/init-ollama.sh"]
    restart: "no"

  backend:
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}"
    restart: always
    ports:
      - "8000:8000"
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      - API_KEY=${API_KEY:-ollama}
      - BASE_URL=${BASE_URL:-http://ollama:11434/v1}
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.5-uncensored}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/liveness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: "${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG:-latest}"
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_BASE_URL:-http://localhost:8000/api/v1}
        - NODE_ENV=production

volumes:
  ollama_data:
