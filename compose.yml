services:
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: always
    volumes:
      - /data/sorrynotnhired/models:/models:ro
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_THREADS=3
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - /data/sorrynotnhired/models:/models:ro
      - ./Modelfile:/tmp/Modelfile:ro
      - ./init-ollama.sh:/tmp/init-ollama.sh:ro
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/tmp/init-ollama.sh"]
    restart: "no"

  backend:
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG:-latest}"
    restart: always
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 64
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      - API_KEY=${API_KEY:-ollama}
      - BASE_URL=${BASE_URL:-http://ollama:11434/v1}
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.5-uncensored}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-2048}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-120}
      - LLM_READ_TIMEOUT_SECONDS=${LLM_READ_TIMEOUT_SECONDS:-30}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-0}
      - MAX_CONCURRENT_ROASTS=${MAX_CONCURRENT_ROASTS:-4}
      - MAX_PDF_JOBS=${MAX_PDF_JOBS:-2}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES:-20}
      - MAX_CV_CHARS=${MAX_CV_CHARS:-100000}
      - PDF_TIMEOUT_SECONDS=${PDF_TIMEOUT_SECONDS:-15}
      - PDF_MEMORY_MB=${PDF_MEMORY_MB:-512}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/liveness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: "${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG:-latest}"
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    environment:
      - ROAST_REQUESTS_PER_MINUTE=${ROAST_REQUESTS_PER_MINUTE:-6}
      - ROAST_BURST=${ROAST_BURST:-2}
      - MAX_CONCURRENT_ROASTS=${MAX_CONCURRENT_ROASTS:-4}
      - MAX_ROASTS_PER_IP=${MAX_ROASTS_PER_IP:-2}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - REQUIRE_HTTPS=${REQUIRE_HTTPS:-0}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: frontend/Dockerfile

volumes:
  ollama_data:
