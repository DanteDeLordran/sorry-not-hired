services:
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile:/tmp/Modelfile:ro
      - ./init-ollama.sh:/tmp/init-ollama.sh:ro
    command: sh -c "ollama serve & sleep 5 && /tmp/init-ollama.sh || true && wait"

  backend:
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
    restart: always
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-lm_studio}
      - OLLAMA_BASE_URL=http://ollama:11434
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/liveness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - ollama
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: "${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}"
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - NODE_ENV=production

volumes:
  ollama_data:
