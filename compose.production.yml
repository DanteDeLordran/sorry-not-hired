# Requires Docker Compose 2.24.4+ for !reset.
services:
  frontend:
    ports: !reset []
    environment:
      REQUIRE_HTTPS: "1"
      TRUSTED_PROXY_CIDRS: "${INGRESS_PROXY_IP:-172.30.0.2}/32"
    networks:
      - default
      - ingress

  caddy:
    image: caddy:2-alpine
    restart: always
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cpus: 1.0
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:?Set PUBLIC_HOST to your public DNS hostname}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      ingress:
        ipv4_address: "${INGRESS_PROXY_IP:-172.30.0.2}"
    depends_on:
      - frontend
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64

networks:
  ingress:
    ipam:
      config:
        - subnet: "${INGRESS_SUBNET:-172.30.0.0/24}"

volumes:
  caddy_data:
  caddy_config:
