# These zones are shared by all Nginx workers.
limit_req_zone $binary_remote_addr zone=roast_rate:10m rate=${ROAST_REQUESTS_PER_MINUTE}r/m;
limit_conn_zone $binary_remote_addr zone=roast_per_ip:10m;
limit_conn_zone $server_name zone=roast_global:1m;

geo $realip_remote_addr $trusted_proxy {
    default 0;
    include /tmp/nginx/trusted-proxy-geo.conf;
}

map "$trusted_proxy:$http_x_forwarded_proto" $external_scheme {
    default $scheme;
    "1:https" https;
}

map "${REQUIRE_HTTPS}:$external_scheme" $redirect_https {
    default 0;
    "1:http" 1;
}

map $external_scheme $hsts {
    default "";
    https "max-age=31536000";
}

map $uri $cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    include /tmp/nginx/trusted-proxies.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($redirect_https) {
        return 308 https://$host$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # No location defines add_header, so every response inherits these headers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $cache_control always;

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=roast_rate burst=${ROAST_BURST} nodelay;
        limit_req_status 429;
        limit_conn roast_per_ip ${MAX_ROASTS_PER_IP};
        limit_conn roast_global ${MAX_CONCURRENT_ROASTS};
        limit_conn_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 135s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite untrusted inbound headers instead of appending them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
    }
}
